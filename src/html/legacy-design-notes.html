══════════════════════════════════════════════════════════════════════════════
  DESIGN PHILOSOPHY
══════════════════════════════════════════════════════════════════════════════

  1. TURN-BASED ROGUELITE FEEL
     Every player action advances a turn counter (G.turn). Resources tick down
     per turn (fuel in space, oxygen on planet). There is no real-time loop.
     Actions are keyboard-driven; mouse is supplementary (compass widget,
     barter overlay). The game should feel like a classic PC roguelite but with
     a narrative, cinematic side.

  2. FIXED-SIZE CANVAS + CSS SCALE-TO-FIT
     The root div is fixed at 1400×720 px. A JS resize observer applies
     transform:scale() so the game fills any screen without reflowing HTML.
     Do NOT change the root size or the layout will break on all viewports.
     Canvas is 960×480 px (tile size TS=24px, so 40×20 tiles visible).

  3. GLOBAL STATE OBJECT G
     All mutable game state lives in a single global object G (see initGame()).
     G.mode drives what is drawn and what keyboard inputs do:
       'galaxy'   — top-down scrolling galaxy map, ship movement
       'system'   — solar system view, planet selection
       'planet'   — tile-based ground exploration
       'base'     — starbase / casino / derelict interior menus
       'inventory'— full-screen inventory/crew/cargo/ship tabs
     Adding a new mode means: add a case to renderAll(), handleKey(), and
     updateCtxBar(). Everything else reads G.mode to decide what to show.

  4. RENDER-ON-DEMAND (not a game loop)
     There is NO setInterval/requestAnimationFrame main loop. renderAll() is
     called explicitly after every state change. This keeps CPU use near zero
     when idle. Exception: meteor animations in galaxy view use rAF internally
     but only while meteors exist.

  5. TILE-BASED PLANET MAPS
     Planet grids are stored as G.planets[key].grid — a 2D array of cell
     objects { type, ...props }. Tile types are defined in the TILE object.
     Each tile has: pass (walkable), sprite (PNG key), drawFn (DRAW method),
     and optional flags. Fog of war uses a flat visited[] boolean array.
     LOS uses a simple raycasting hasLOS(x,y) function.

  6. PROCEDURAL GENERATION PRINCIPLES
     - Galaxy: generateGalaxy() places nebulae, bases, systems, pirates, etc.
       Star type (YELLOW/RED/BLUE/WHITE) drives what planet biomes can appear
       per orbit slot. See STAR_TYPES.
     - Planets: generatePlanetGrid() builds tile maps from biome templates.
       Each biome has its own floor tile, obstacle types, creature pool, and
       ambient rules. Special planets (RINGWORLD, NUCLEAR_WAR, BLOOM, etc.)
       have unique hand-crafted generation logic — one spawns per run.
     - Creatures: spawnCreatures() picks from BIOME_CREATURES[biome] templates,
       places them with proximity-to-nest logic. Hostile biomes get apex
       predators via the HOSTILE_CREATURE system with procedural names.
     - Civilizations: civs are seeded per-planet. Tier (primitive→information)
       drives contact mechanics, barter stock, building tile types, and
       NPC sprite variants. Traits (diet, social, curiosity, honor) modulate
       first-contact dialogue outcomes.
     - RNG: Math.random() is used freely EXCEPT for deterministic per-entity
       content (civ barter stock uses civRng(seed) — a seedable LCG so the
       same civ always has the same wares).

  7. DRAWING SYSTEM — THREE LAYERS
     a) SPRITES_B64: Base64-encoded PNG spritesheets (24×24 px per tile).
        Loaded once into IMG cache. Used for most tiles and characters.
     b) DRAW object: Procedural canvas 2D draw functions for complex/animated
        tiles (planet types, creature sprites, civ buildings, etc.). Each
        function receives (ctx, x, y) in screen-pixel coordinates.
     c) ASCII fallback: OPTIONS.asciiMode replaces all sprites with single
        characters from the ASCII lookup table. Must be maintained alongside
        any new tile type.
     Rule: prefer DRAW functions for new unique tiles; use sprite PNG for
     tiles that need pixel-art detail or share a spritesheet slot.

  8. UI LAYOUT (fixed regions, do not reflow)
     #hud (top, 46px)         — credits, location, turn, mode
     #gauge-panel (left, 64px) — fuel/hull in space; O₂ on planet
     #canvas-wrap (972px)     — the game canvas + tooltip overlay
     #sidebar (362px right)   — crew list, log entries, context info
     #msg-bar (28px)          — one-line flash messages
     #ctx-bar (38px)          — contextual action hint buttons [KEY] Label
     #persist-bar (30px)      — always-visible global actions (map, inv, etc.)
     #version-tag (18px)      — bottom right version string
     Overlays (inventory, barter, dialogue, feedback) use position:fixed
     with high z-index and are toggled via display:flex/none.

  9. CREW SYSTEM
     Crew members have: role, name, hp/maxHp, moraleBase, skills (atk, def,
     med, eng, sci, pilot), statuses[], weaponUsable. Roles: captain, scout,
     engineer, scientist. Skills affect dice rolls in combat, repairs, medical
     events, science jobs. Status effects (bleeding, fever, radiation, etc.)
     tick each turn via tickCrewStatuses(). Each status has a chain of
     progression/recovery transitions — do not break these chains when adding
     new statuses.

  10. COMBAT
      Ground combat: turn-based, crew vs enemies. Each side rolls atk vs def.
      Ranged combat adds a targeting cursor (G.rangeTarget) and fire mode.
      Ship combat (G.shipCombat): modal overlay, round-based, uses installed
      weapons and modules. Pirate ships have configurable loadouts.

  11. ANALYTICS
      Google Analytics 4 (gtag) is integrated. trackEvent() wraps all calls
      with try/catch so it never crashes the game. Events are fired for:
      new_game_started, turn_milestone (per 100), planet_landed, combat,
      barter_trade, retired, game_over. Add new events for significant new
      features so player behaviour data stays useful.

  12. SAVE / RESTORE
      localStorage autosave is active (key: prospector_autosave). Manual
      save-to-file and load-from-file (JSON) are available from the main menu
      and in-game. Use save-to-file when switching to a new index.html version
      in Firefox, since file:// origins isolate localStorage per file path.

  13. CODE CONVENTIONS
      - Global constants in SCREAMING_SNAKE_CASE (TILE, BIOMES, DRAW, etc.)
      - Game state fields on G in camelCase
      - Helper functions in camelCase, prefixed by domain (civXxx, crewXxx,
        planetXxx, drawXxx, etc.)
      - Render functions named drawXxx or renderXxx
      - Log helpers: addLog(text, cssClass) — classes: lc=critical, ll=loud,
        li=info, lm=muted, lg=good, lw=warn
      - rnd(n) = Math.floor(Math.random()*n), pick(arr) = arr[rnd(arr.length)]

  DIALOGUE SYSTEM DESIGN PHILOSOPHY
  (earned through extensive iteration — apply these rules to all future dialogue)
══════════════════════════════════════════════════════════════════════════════

  CORE PRINCIPLE: Options should only reference things the player already knows.
  If a label names a concept (council, fire, a person's role), that concept must
  have been introduced in the current conversation before the label appears.
  Exposing unknown information in option labels breaks immersion and skips beats.

  ── NAVIGATION RULES ──────────────────────────────────────────────────────────

  1. BACK vs LEAVE vs CLOSE
     - "Back" / "Continue" / "Step back" → always next:'root' or next:<parent node>
       Never action:'close'. These are navigation, not exits.
     - "Leave" → action:'close'. Reserved for intentional full exits from the
       encounter. Should only appear on root or genuine dead-end nodes.
     - Dead-end nodes (combat triggered, civ fled, encounter fully resolved)
       may use action:'close' directly — these are forced exits, not navigation.
     - NEVER use "Back away" as a close action mid-conversation. Rename it
       "Leave" if it truly exits, or route it to root if it's a retreat posture.

  2. POSITIVE OUTCOME NODES
     Nodes that represent something good happening (gift received, analysis done,
     knowledge shared, non-interference accepted, hunt joined, aid received, etc.)
     should NOT have a "Leave" option. The player has just succeeded at something.
     Route them to "Continue" → root. Let the player choose to leave from root
     with full awareness of their options. Pattern:
       options: [{label:'Continue', next:'root'}]   // positive outcome
       options: [{label:'Back', next:'root'}]        // neutral result / info node

  3. ROOT NODE MUST BE repeatable: true
     The root node text reflects relationship state (memories, language, relation,
     alert, unlocks). It must re-evaluate every time the player returns to it.
     Without repeatable:true, text is cached after first visit and never updates.
     Apply to any node whose text is driven by live game state rather than a
     one-time event.

  4. NO ATTACK OPTION AFTER PEACEFUL ACTIONS
     Do not push an attack_civ option immediately after:
     - gift_given (the gift just landed — attack is incoherent)
     - territorial_accept_demand (the crew just yielded — attack is incoherent)
     Attack should be available from root and hostile_menu, not from outcome nodes.

  5. LOOT OPTIONS ARE SETTLEMENT-ONLY
     "Take from them by force" and "Take what's left behind" must be gated by
     !isLocalContact(). A local NPC that goes hostile is a combat encounter on
     the map — there is nothing to loot through a dialogue menu. Apply this gate
     to both root's hostile branch AND hostile_menu. Both must stay in sync.

  ── CONTENT / SEQUENCING RULES ────────────────────────────────────────────────

  6. OPTION LABELS REFLECT WHAT THE PLAYER DOES, NOT WHAT THEY WANT
     "Move toward them — open hands" not "Try to be friendly".
     "Stand tall — hold eye contact" not "Assert dominance".
     Labels describe the physical/social action. The outcome is unknown.

  7. TEXT MUST REFLECT CURRENT STATE, NOT INITIAL STATE
     Subtitle disposition words (e.g. "watching the crew closely") should read
     the current contact state, not the static trait value. Once the player has
     interacted, the trait is context — what matters is where the relationship is.
     Priority order for disposition text:
       hostile → subdued → on the edge (alert≥4) → tense (alert≥3)
       → relation-based (contacted) → territorial → trait-based (first contact)

  8. LOG MESSAGES ARE SUMMARIES, NOT DIALOGUE ECHOES
     Never addLog() the same string shown in the dialogue text panel.
     Log messages should be short confirmations of what happened:
       "Dr. Chen — language analysis complete. Comprehension: fragmentary."
     not the full analysis prose. The player can read the dialogue panel.
     Functions that generate dialogue text (e.g. civCustomsStudyText) must NOT
     call addLog() internally — the calling node controls logging.

  9. DEAD CODE AUDIT
     civFirstContactText() is defined but never called (~line 17038). It contains
     the old "pressure block" stat-dump. Do not revive it. If refactoring the
     scene text system, delete it entirely.

  ── ARCHITECTURE NOTES ────────────────────────────────────────────────────────

  10. DIALOGUE CACHING
      enterDialogueNode() caches node text in G.dialogue.nodeText[nodeId] on first
      visit. Text only re-evaluates if node.repeatable === true or the node has
      never been visited. Nodes whose text depends on live state (relation, alert,
      language, memories) must be repeatable. Static outcome text (e.g. "the gift
      was received") does not need to be repeatable.

  11. CONTACT KIND GATES
      isLocalContact() — player is adjacent to a civ NPC on the map
      isSettlementContact() — player is adjacent to a civ building tile
      isDelegationContact() — a delegation has formally approached the crew
      Most loot and force options should check !isLocalContact() before appearing.
      Non-primitive tiers can have local contacts too (workers, guards, officials)
      — the gate applies to all tiers, not just primitives.

  12. civCustomsStudyText() SIDE EFFECTS
      This function gives sci XP, increments languageProgress, and returns prose.
      It is called from both scientist_analyse (dialogue node) and study_customs.
      It must NOT call addLog() — that is the caller's responsibility.
      If you add new text-generating functions with side effects, follow this rule.

  13. civCanAnalyzeLanguage() GATES
      Returns false if: hostile, languageAnalysisDone this visit, progress >= CIV_LANGUAGE_MAX.
      Do NOT add a 'contacted' gate — analysis should be available on return visits
      until the natural caps are reached. The contacted gate was removed because it
      was blocking analysis for the entire post-first-contact game.
